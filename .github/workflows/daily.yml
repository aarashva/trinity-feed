name: Daily FX Strike Auto-Scraper

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: بررسی و دانلود ریپازیتوری
      uses: actions/checkout@v4

    - name: نصب پایتون
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: نصب کتابخانه‌ها
      run: |
        pip install requests beautifulsoup4

    - name: استخراج دیتای زنده استرایک
      run: |
        python fetch_strikes.py

    - name: ذخیره و کامیت خودکار فایل today.json
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add today.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update EURUSD Strike [$(date -u +'%Y-%m-%d')]" && git push)
